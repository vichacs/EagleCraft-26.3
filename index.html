<script>
  // ====== URL DEL RELEASE (la que descarga el .html) ======
  const URL_JUEGO = "https://github.com/vichacs/EagleCraft-26.3/releases/download/s/index.html";
  // ========================================================

  const TITULO = "Google Classroom";

  // GitHub Releases no permite CORS: se prueba directo y luego con espejos de GitHub
  const ORIGENES = [
    (u) => u,
    (u) => "https://gh-proxy.com/" + u,
    (u) => "https://ghfast.top/" + u,
    (u) => "https://mirror.ghproxy.com/" + u
  ];

  const boton = document.getElementById("jugar");
  const msg = document.getElementById("msg");

  function aviso(t, error) { msg.textContent = t; msg.className = error ? "error" : ""; }

  function ponerTitulo() {
    document.title = TITULO;
    // Si la página está incrustada, solo se puede cambiar el título de la pestaña si es del mismo origen
    try { window.top.document.title = TITULO; } catch (e) {}
  }

  // Descarga en streaming; se corta si no hay respuesta o se queda parada
  async function bajar(url, progreso) {
    const ctl = new AbortController();
    let timer = setTimeout(() => ctl.abort(), 15000);
    try {
      const res = await fetch(url, { signal: ctl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const total = Number(res.headers.get("Content-Length")) || 0;
      const lector = res.body.getReader();
      const trozos = [];
      let rec = 0;
      for (;;) {
        clearTimeout(timer);
        timer = setTimeout(() => ctl.abort(), 20000);
        const { done, value } = await lector.read();
        if (done) break;
        trozos.push(value);
        rec += value.length;
        progreso(rec, total);
      }
      const blob = new Blob(trozos, { type: "text/html" });
      if (blob.size < 100000) throw new Error("Respuesta demasiado pequeña");
      return blob;
    } finally { clearTimeout(timer); }
  }

  boton.addEventListener("click", async () => {
    boton.disabled = true;
    aviso("Conectando…");

    let blob = null;
    for (let i = 0; i < ORIGENES.length && !blob; i++) {
      try {
        aviso(i === 0 ? "Conectando…" : "Probando otra ruta (" + i + "/" + (ORIGENES.length - 1) + ")…");
        blob = await bajar(ORIGENES[i](URL_JUEGO), (r, t) => {
          const mb = (r / 1048576).toFixed(1);
          aviso("Descargando… " + (t ? Math.round(r / t * 100) + "% (" + mb + " MB)" : mb + " MB"));
        });
      } catch (e) { console.warn("Ruta " + i + " falló:", e); }
    }

    if (!blob) {
      aviso("No se pudo descargar el juego desde GitHub. Inténtalo de nuevo en unos minutos.", true);
      boton.disabled = false;
      return;
    }

    // El juego sustituye a la página actual, a pantalla completa, en la misma pestaña
    const url = URL.createObjectURL(blob);
    const marco = document.createElement("iframe");
    marco.style.cssText = "border:0;position:fixed;inset:0;width:100%;height:100%;background:#121212";
    marco.setAttribute("allow", "fullscreen; gamepad; autoplay; pointer-lock; clipboard-write");
    marco.setAttribute("allowfullscreen", "");
    marco.src = url;

    document.body.style.overflow = "hidden";
    document.body.textContent = "";
    document.body.appendChild(marco);

    ponerTitulo();
    setInterval(ponerTitulo, 1000);
  });
</script>
