<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Classroom</title>
<style>
  html, body {
    height: 100%; margin: 0;
    background: #121212;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { text-align: center; padding: 16px; }
  #jugar {
    padding: 18px 56px;
    font-size: 1.6rem; font-weight: 800; letter-spacing: .1em;
    color: #0b0b0b;
    background: #2ecc40;
    border: 3px solid #1b8a28;
    border-radius: 12px;
    box-shadow: 0 6px 0 #14661d;
    cursor: pointer;
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  #jugar:hover { background: #3be24f; }
  #jugar:active { transform: translateY(5px); box-shadow: 0 1px 0 #14661d; }
  #jugar:focus-visible { outline: 3px solid #bdbdbd; outline-offset: 4px; }
  #jugar:disabled { background: #6b6b6b; border-color: #4a4a4a; box-shadow: 0 6px 0 #333; color: #ddd; cursor: progress; }
  #msg { margin-top: 18px; min-height: 1.3em; color: #9e9e9e; font-size: .95rem; }
  #msg.error { color: #ff6b6b; }
</style>
</head>
<body>

<script>
(function () {
  // ====== URL DEL RELEASE (la que descarga el .html) ======
  const URL_JUEGO = "https://github.com/vichacs/EagleCraft-26.3/releases/download/s/index.html";
  // ========================================================

  const TITULO = "Google Classroom";

  // GitHub Releases no permite CORS: se prueba directo y luego con espejos de GitHub
  const ORIGENES = [
    (u) => u,
    (u) => "https://gh-proxy.com/" + u,
    (u) => "https://ghfast.top/" + u,
    (u) => "https://mirror.ghproxy.com/" + u
  ];

  // La interfaz se crea aquí, así los elementos siempre existen
  const wrap = document.createElement("div");
  wrap.id = "wrap";

  const boton = document.createElement("button");
  boton.id = "jugar";
  boton.type = "button";
  boton.textContent = "JUGAR";

  const msg = document.createElement("div");
  msg.id = "msg";
  msg.setAttribute("role", "status");
  msg.setAttribute("aria-live", "polite");

  wrap.appendChild(boton);
  wrap.appendChild(msg);
  document.body.appendChild(wrap);

  function aviso(t, error) { msg.textContent = t; msg.className = error ? "error" : ""; }

  function ponerTitulo() {
    document.title = TITULO;
    try { window.top.document.title = TITULO; } catch (e) {}
  }
  ponerTitulo();

  // Los errores inesperados salen en pantalla
  window.addEventListener("error", (e) => aviso("Error: " + e.message, true));
  window.addEventListener("unhandledrejection", (e) =>
    aviso("Error: " + ((e.reason && e.reason.message) || e.reason), true));

  // Descarga en streaming; se corta si no hay respuesta o se queda parada
  async function bajar(url, progreso) {
    const ctl = new AbortController();
    let timer = setTimeout(() => ctl.abort(), 15000);
    try {
      const res = await fetch(url, { signal: ctl.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const total = Number(res.headers.get("Content-Length")) || 0;
      const lector = res.body.getReader();
      const trozos = [];
      let rec = 0;
      for (;;) {
        clearTimeout(timer);
        timer = setTimeout(() => ctl.abort(), 20000);
        const { done, value } = await lector.read();
        if (done) break;
        trozos.push(value);
        rec += value.length;
        progreso(rec, total);
      }
      const blob = new Blob(trozos, { type: "text/html" });
      if (blob.size < 100000) throw new Error("Respuesta demasiado pequeña");
      return blob;
    } finally { clearTimeout(timer); }
  }

  boton.addEventListener("click", async () => {
    boton.disabled = true;
    aviso("Conectando…");

    let blob = null;
    for (let i = 0; i < ORIGENES.length && !blob; i++) {
      try {
        aviso(i === 0 ? "Conectando…" : "Probando otra ruta (" + i + "/" + (ORIGENES.length - 1) + ")…");
        blob = await bajar(ORIGENES[i](URL_JUEGO), (r, t) => {
          const mb = (r / 1048576).toFixed(1);
          aviso("Descargando… " + (t ? Math.round(r / t * 100) + "% (" + mb + " MB)" : mb + " MB"));
        });
      } catch (e) { console.warn("Ruta " + i + " falló:", e); }
    }

    if (!blob) {
      aviso("No se pudo descargar el juego desde GitHub. Inténtalo de nuevo en unos minutos.", true);
      boton.disabled = false;
      return;
    }

    // El juego sustituye a la página actual, a pantalla completa, en la misma pestaña
    const url = URL.createObjectURL(blob);
    const marco = document.createElement("iframe");
    marco.style.cssText = "border:0;position:fixed;inset:0;width:100%;height:100%;background:#121212";
    marco.setAttribute("allow", "fullscreen; gamepad; autoplay; pointer-lock; clipboard-write");
    marco.setAttribute("allowfullscreen", "");
    marco.src = url;

    document.body.style.display = "block";
    document.body.style.overflow = "hidden";
    document.body.textContent = "";
    document.body.appendChild(marco);

    ponerTitulo();
    setInterval(ponerTitulo, 1000);
  });
})();
</script>

</body>
</html>
